<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>GeoForX — геоинформационная система для лесной отрасли</title>
  <meta
    name="description"
    content="GeoForX — разрабатываемая геоинформационная система для задач лесной отрасли. Приложение находится в разработке."
  >

  <meta property="og:type" content="website">
  <meta property="og:title" content="GeoForX — геоинформационная система для лесной отрасли">
  <meta
    property="og:description"
    content="Геоинформационная система GeoForX находится в разработке."
  >
  <meta property="og:image" content="https://geoforx.ru/forest-bg.png">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background-color: #17241f;
    }

    body {
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      padding: 40px 20px;
      isolation: isolate;

      /*
        Фотография заполняет экран.
        На телефоне её края могут обрезаться, но логотип — нет:
        он расположен отдельно от фона.
      */
      background-color: #17241f;
      background-image:
        linear-gradient(
          180deg,
          rgba(9, 20, 17, 0.12) 0%,
          rgba(9, 20, 17, 0.22) 48%,
          rgba(9, 20, 17, 0.55) 100%
        ),
        url("forest-bg.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .content {
      width: min(100%, 1100px);
      text-align: center;
    }

    .brand {
      margin: 0 auto 28px;
      line-height: 0;
    }

    .brand img {
      display: block;
      width: min(100%, 1000px);
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.35));
    }

    .description {
      max-width: 680px;
      margin: 0 auto 18px;
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.5;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    }

    .status {
      display: inline-block;
      margin: 0;
      padding: 9px 16px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      background-color: rgba(12, 27, 21, 0.55);
      font-size: 14px;
      line-height: 1.4;
    }

    @media (max-width: 700px) {
      .page {
        padding: 32px 16px;
      }

      .brand {
        margin-bottom: 24px;
      }

      .brand img {
        width: 100%;
      }

      .description {
        max-width: 400px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="content">
      <h1 class="brand">
        <img src="logo.png" alt="GeoForX">
      </h1>

      <p class="description">
        Разрабатываем геоинформационную систему для задач лесной отрасли.
      </p>

      <p class="status">Приложение находится в разработке</p>
    </div>
  </main>
</body>
</html>
