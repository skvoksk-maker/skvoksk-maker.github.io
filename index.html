<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>GeoForX — геоинформационная система для лесной отрасли</title>
  <meta name="description" content="GeoForX — разрабатываемая геоинформационная система для задач лесной отрасли. Сайт и приложение находятся в разработке.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="GeoForX — геоинформационная система для лесной отрасли">
  <meta property="og:description" content="GeoForX находится в разработке. Следите за запуском проекта.">
  <meta property="og:image" content="https://geoforx.ru/forest-bg.png">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #17251f;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Фотография заполняет экран. На узких экранах её края могут обрезаться,
       но логотип теперь отдельный и поэтому не обрежется. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background: #17251f url("forest-bg.png") center center / cover no-repeat;
    }

    /* Затемнение помогает читать текст на светлых участках фотографии. */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        180deg,
        rgba(8, 20, 17, .18),
        rgba(8, 20, 17, .40) 42%,
        rgba(8, 20, 17, .72)
      );
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .content {
      width: min(100%, 1100px);
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3vw, 36px);
      margin-bottom: 30px;
    }

    .brand-icon {
      display: block;
      width: clamp(100px, 18vw, 210px);
      height: auto;
      flex: none;
      filter: drop-shadow(0 5px 12px rgba(0, 0, 0, .35));
    }

    h1 {
      margin: 0;
      font-size: clamp(54px, 9vw, 120px);
      font-weight: 800;
      letter-spacing: -.065em;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 5px 20px rgba(0, 0, 0, .45);
    }

    h1 span {
      color: #acd18f;
    }

    .description {
      max-width: 680px;
      margin: 0 auto 20px;
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.5;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .75);
    }

    .status {
      display: inline-block;
      margin: 0;
      padding: 9px 16px;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 999px;
      background: rgba(10, 27, 21, .48);
      font-size: 14px;
      letter-spacing: .02em;
    }

    @media (max-width: 700px) {
      .brand {
        flex-direction: column;
        gap: 12px;
        margin-bottom: 24px;
      }

      .brand-icon {
        width: clamp(105px, 30vw, 150px);
      }

      h1 {
        font-size: clamp(46px, 13vw, 76px);
      }

      .description {
        max-width: 420px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="content">
      <div class="brand">
        <!-- Значок выполнен в SVG: остаётся чётким на любом экране. -->
        <svg class="brand-icon"
             viewBox="0 0 210 180"
             xmlns="http://www.w3.org/2000/svg"
             aria-hidden="true"
             focusable="false">

          <!-- Геометка -->
          <path fill="#494b4e"
                d="M105 2c-26 0-47 21-47 47 0 34 47 84 47 84s47-50 47-84c0-26-21-47-47-47zm0 29a18 18 0 1 1 0 36 18 18 0 0 1 0-36z"/>

          <!-- Левое дерево -->
          <path fill="#acd18f"
                d="m34 56-22 32h11L4 113h54L39 88h11L34 56z"/>

          <!-- Правое дерево -->
          <path fill="#acd18f"
                d="m176 56-22 32h11l-19 25h54l-19-25h11l-16-32z"/>

          <!-- Волны / линии карты -->
          <path d="M11 134c25-14 43-14 69 1
                   M16 151c22-12 40-12 62 1
                   M22 167c19-10 34-10 50 1"
                fill="none"
                stroke="#fff"
                stroke-width="11"
                stroke-linecap="round"/>

          <!-- X -->
          <path d="m120 130 19 0 22 24 22-24h19l-31 35 32 0v15h-45l-19-21-19 21h-20l30-34z"
                fill="#494b4e"/>
        </svg>

        <h1>GeoFor<span>X</span></h1>
      </div>

      <p class="description">
        Разрабатываем геоинформационную систему для задач лесной отрасли.
      </p>

      <p class="status">Приложение находится в разработке</p>
    </div>
  </main>
</body>
</html>
